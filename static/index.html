<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudGuardian</title>
<style>
:root{--bg:#0f1114;--sf:#16191e;--sf2:#1d2127;--ln:#2a2f37;--tx:#e4e7eb;--mu:#8a93a0;--ac:#4c8dff;--onac:#0b1220;--ok:#3fb27f;--bad:#e5484d;--wr:#d9a02f;--c1:#4c8dff;--c2:#3fb27f;--c3:#d9a02f;--c4:#6b7480;--fl:rgba(76,141,255,.14);--oka:rgba(63,178,127,.4);--pad:24px;--gap:16px;--side:232px}
:root[data-theme=light]{--bg:#f4f5f7;--sf:#fff;--sf2:#f1f3f6;--ln:#dde1e7;--tx:#1b2330;--mu:#667085;--ac:#2563eb;--onac:#fff;--ok:#15803d;--bad:#c0392b;--wr:#a16207;--c1:#2563eb;--c2:#15803d;--c3:#b7791f;--c4:#667085;--fl:rgba(37,99,235,.1);--oka:rgba(21,128,61,.4)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
/* shell: sidebar + header + main */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}.mainc{min-width:0}
.side{background:var(--sf);border-right:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;height:32px;font-weight:600;font-size:15px}.logo i{width:18px;height:18px;border-radius:4px;background:var(--ac);flex:none}
nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:6px;color:var(--mu);text-decoration:none;font-size:14px;font-weight:500;box-shadow:inset 2px 0 0 transparent;transition:background .15s,color .15s,box-shadow .15s}
.nv svg{width:20px;height:20px;flex:none}.nv:hover{background:var(--sf2);color:var(--tx)}.nv.on{background:var(--fl);color:var(--ac);box-shadow:inset 2px 0 0 var(--ac)}
#sfoot{margin-top:auto;padding:0 8px;font-size:12px;display:grid;gap:2px}
.bar{display:flex;align-items:center;gap:12px;padding:12px var(--pad);border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:3}.bar h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
.sq{flex:1;min-width:0;max-width:440px;margin-left:12px}.rt{display:flex;align-items:center;gap:12px;margin-left:auto}.menu{display:none;align-items:center;justify-content:center;width:34px;padding:0}.menu svg{width:18px;height:18px}
.mb{padding:6px var(--pad);font-size:12px;border-bottom:1px solid var(--ln)}.mb.sim{background:var(--fl);color:var(--ac)}.mb.live{background:rgba(63,178,127,.12);color:var(--ok)}
.live{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px;white-space:nowrap}.pd{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.content{padding:var(--pad) var(--pad) 48px}.scrim{display:none}
/* components */
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:8px;min-width:0}.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ln);min-height:41px}.pt{font-weight:600;font-size:13px}.pb{padding:14px}.mt{margin-top:var(--gap)}
.g3,.g2,.cols2,.kpis{display:grid;gap:var(--gap)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2,.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:span 2}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:var(--gap)}.kp{padding:12px 14px;min-height:76px;display:flex;flex-direction:column;justify-content:center}.rg{flex-direction:row;align-items:center;gap:14px}.rg svg{width:48px;height:48px;flex:none}.kv{font-size:24px;font-weight:600;line-height:1.2;margin-top:2px}
.lb{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:14px 0 4px}.kp .lb{margin:0}.mu{color:var(--mu)}.note{margin:0 0 var(--gap);color:var(--mu)}.sec{font-size:13px;margin:24px 0 10px;font-weight:600}.lk{color:var(--ac);text-decoration:none;font-size:12px}p{margin:0 0 4px}
.rw{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ln)}.rw:last-child{border:0}.gr1{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mu)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.wr{background:var(--wr)}
.tg{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;background:var(--sf2);color:var(--mu);margin-left:6px;white-space:nowrap}td .tg,.rw .tg{margin-left:0}.tg.ok{color:var(--ok)}.tg.bad{color:var(--bad)}.tg.wr{color:var(--wr)}.tg.in{background:var(--fl);color:var(--ac);margin:0}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);font:500 12.5px system-ui,sans-serif;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}.btn:hover{border-color:var(--mu)}.btn:active{transform:translateY(1px)}.btn:focus-visible,select:focus-visible,input:focus-visible,.nv:focus-visible{outline:2px solid var(--ac);outline-offset:1px}.btn:disabled{opacity:.5;cursor:default}
.btn.sm{height:26px;padding:0 10px;font-size:12px}.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--onac)}.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
select,input{height:30px;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:0 10px;font:inherit}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse}.tbl th{height:36px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:500;text-align:left;padding:0 14px;border-bottom:1px solid var(--ln);white-space:nowrap}.tbl td{height:40px;padding:0 14px;border-bottom:1px solid var(--ln);vertical-align:middle}.tbl tr:last-child td{border:0}.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:var(--sf2)}.wrap{overflow-x:auto}.mono{font:12px ui-monospace,Menlo,Consolas,monospace}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:10px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:4px 0 0;max-width:100%}pre.chg{border-color:var(--wr)}.k{color:var(--ac)}
.empty{padding:14px 16px;color:var(--mu);text-align:left}.es{display:flex;flex-direction:column;gap:12px;padding:16px;align-items:flex-start}.es .ac{margin:0}.chip{display:inline-block;font:12px ui-monospace,Menlo,monospace;background:var(--sf2);border-radius:4px;padding:1px 6px;margin:0 4px 4px 0}
.bt{height:6px;background:var(--sf2);border-radius:3px;overflow:hidden;margin:4px 0 10px}.bt i{display:block;height:100%;background:var(--ac);border-radius:3px;transform-origin:left}.br{display:flex;justify-content:space-between;gap:12px}
.st{display:flex;flex-wrap:wrap;gap:8px 24px;margin:6px 0 8px}.s{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu)}.s:before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mu)}.s.d{color:var(--tx)}.s.d:before{background:var(--ok);border-color:var(--ok)}.s.a{color:var(--wr)}.s.a:before{border-color:var(--wr);animation:pulse 1.6s infinite}.s.x{color:var(--bad)}.s.x:before{background:var(--bad);border-color:var(--bad)}
.fc{margin-bottom:var(--gap)}.fc.enter{animation:slide .35s cubic-bezier(.2,.7,.2,1)}.fresh td,.fresh{animation:flash 1.6s ease-out}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:var(--gap);border:1px solid var(--ln);border-radius:8px;background:var(--sf);overflow:hidden}.stg{padding:10px 14px;border-right:1px solid var(--ln);position:relative}.stg:last-child{border:0}.stg span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}.stg b{font-size:18px}.stg.on{background:var(--fl)}.stg.on:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--wr);transform-origin:left;animation:scan 1.8s ease-in-out infinite}
.cslot{width:100%}.cslot svg{display:block}.sk{background:var(--sf2);animation:sk 1.4s ease-in-out infinite}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,100vw);background:var(--sf);border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.2,1);z-index:40;overflow-y:auto;visibility:hidden}.drawer.open{transform:none;visibility:visible}.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--sf);z-index:1}.db{padding:0 16px 24px}.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tl div{font:12px ui-monospace,Menlo,Consolas,monospace;padding:4px 0;border-bottom:1px solid var(--ln);word-break:break-word}.rk b{font-size:26px}
/* legacy SVG charts (seed spread) only: scoped so icons and ECharts keep their own sizes */
.pb>svg{display:block;width:100%;height:auto}svg text.ax{fill:var(--mu);font-size:11px}.gl{stroke:var(--ln)}.lg{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.draw{stroke-dasharray:1}.pop{transform-box:fill-box;transform-origin:center}.rc{transition:stroke-dasharray .9s cubic-bezier(.2,.7,.2,1)}
.anim{animation:fade .28s ease-out}.anim .pop{animation:pop .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*90ms + .4s)}.anim .draw{animation:draw .8s ease-out both;animation-delay:calc(var(--i)*90ms)}.anim .gx,.enter .gx,.drawer.open .gx{animation:sx .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*80ms)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}@keyframes sx{from{transform:scaleX(0)}}@keyframes pop{from{transform:scale(0)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes slide{from{opacity:0;transform:translateY(10px)}}@keyframes flash{from{background:var(--fl)}}@keyframes pulse{0%{box-shadow:0 0 0 0 var(--oka)}100%{box-shadow:0 0 0 8px transparent}}@keyframes scan{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}@keyframes sk{50%{opacity:.5}}
@media(max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.span2{grid-column:auto}}
@media(max-width:1024px){:root{--pad:16px}.shell{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;width:240px;z-index:30;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility .2s}body.navopen .side{transform:none;visibility:visible}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}body.navopen .scrim{display:block}.menu{display:inline-flex}.bar{flex-wrap:wrap}.sq{order:3;flex-basis:100%;max-width:none;margin:0}.g2,.cols2,.cmp{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.g3,.kpis{grid-template-columns:minmax(0,1fr)}.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.stg{border-bottom:1px solid var(--ln)}.live span{display:none}.feed .ev{grid-template-columns:64px 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="shell"><aside class="side"><div class="logo"><i></i>CloudGuardian</div><nav id="nav"></nav><div id="sfoot"></div></aside>
<div class="mainc"><div class="bar"><button class="btn menu" id="menu" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 id="title"></h1><input id="gq" class="sq" type="search" placeholder="Search findings, events and audit   ( / )" aria-label="Search"><div class="rt"><span id="mode" class="tg in"></span><span class="live"><i class="pd"></i><span id="ver">Connecting</span></span><button class="btn sm" id="theme">Theme</button></div></div><div id="modebar" class="mb sim"></div><main class="content" id="app"></main></div></div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" aria-label="Finding details"></div>
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/views.js"></script>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IC={findings:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',events:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',overview:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',inventory:'<rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/>',threats:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',response:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',audit:'<path d="M5 6h14M5 12h14M5 18h9"/>'};
const PAGES=[["overview","Overview"],["findings","Findings"],["events","Event viewer"],["threats","Detection and XAI"],["inventory","Inventory and posture"],["response","Response queue"],["audit","Audit and evaluation"]];
const NAMES={zscore:"Z-score",isolation_forest:"Isolation Forest",lof:"LocalOutlierFactor",ocsvm:"OneClassSVM"};
const MET=[["precision","Precision"],["recall","Recall"],["f1","F1"],["pr_auc","PR-AUC"]],COL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)"];
let S={resources:[],findings:[],events:[],audit:[],evidence:{},score:100,mode:"",account:"",region:"",polls:0,latency:0,checked:"",video:""},ML={results:{},card:{},multi:"",top:[]},AU={rows:[],chain_ok:true,count:0},DS=[],RU=[],PREV={},SEEN=new Set(),FSEEN=new Set(),SIG="",BOOT=false;
const route=()=>{const r=(location.hash||"#overview").slice(1);return V[r]?r:"overview"},evk=e=>e.t+e.name+e.user;
async function get(p){try{return await (await fetch(p)).json()}catch(e){return null}}
async function act(p){const r=await fetch(p,{method:"POST"});if(!r.ok){const j=await r.json().catch(()=>({}));alert(j.error||"Action failed")}SIG="";await poll()}
async function poll(){const s=await get("/api/state");if(!s)return;S=s;if(!BOOT){BOOT=true;S.events.forEach(e=>SEEN.add(evk(e)));S.findings.forEach(f=>FSEEN.add(f.id+f.status))}head();const g=JSON.stringify([s.findings,s.resources,s.events,s.score,s.evidence]);if(g!==SIG){SIG=g;render()}}
async function loadStatic(){ML=(await get("/api/ml"))||ML;DS=(await get("/api/datasets"))||[];RU=(await get("/api/rules"))||[];render()}
async function loadAudit(){AU=(await get("/api/audit?q="+encodeURIComponent(Views.q())))||AU;if(route()=="audit")render()}
const tg=(t,c)=>`<span class="tg ${c||""}">${esc(t)}</span>`,none=m=>`<div class="empty">${m}</div>`;
function head(){const l=S.mode=="Live AWS";$("mode").textContent=l?"LIVE AWS":"SIMULATOR";$("mode").className="tg "+(l?"ok":"in");$("modebar").className="mb "+(l?"live":"sim");$("modebar").textContent=l?"AWS live mode. Connected to a real account. Attack simulation is disabled.":"Simulation mode. Resources and events come from a local AWS emulator, not a real account.";$("sfoot").innerHTML=`<div class="lb">Data source</div><div>${l?"Live AWS account":"Local AWS emulator"}</div><div class="mu">Account ${esc(S.account)}</div><div class="mu">Region ${esc(S.region)}</div><div class="mu">${S.polls} checks, ${S.latency} ms each</div>`+(S.video?`<a class="lk" href="${esc(S.video)}">Recorded live run</a>`:"");$("ver").textContent="Verified "+S.checked}
function ring(v){const d=2*Math.PI*26,c=v>=80?"var(--ok)":v>=50?"var(--wr)":"var(--bad)";return`<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Posture score ${v}"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--sf2)" stroke-width="7"/><circle class="rc" data-to="${v}" data-d="${d}" cx="32" cy="32" r="26" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${d*v/100} ${d}" transform="rotate(-90 32 32)"/></svg>`}
function bars(f){return f.explain.length>1?f.explain.map((e,i)=>`<div class="br"><span>${esc(e[0])}</span><b>${Math.round(e[1]*100)}%</b></div><div class="bt"><i class="gx" style="width:${e[1]*100}%;--i:${i}"></i></div>`).join(""):`<p class="mu">Rule trace: ${esc(f.ref)} was violated. The raw API response is on the Inventory page.</p>`}
function stepper(f){const s=f.status;return`<div class="st">${["Detected","Approval","Remediated","Verified"].map((x,i)=>`<span class="s ${s=="fixed"?"d":i==0?"d":i==1?(s=="rejected"?"x":"a"):""}">${x}</span>`).join("")}</div>`}
function fcard(f,acts){const lab={pending:["Awaiting approval","wr"],fixed:["Fixed and verified","ok"],rejected:["Rejected","gr"]}[f.status]||[f.status,"gr"],
 a=!acts?"":f.status=="pending"?`<div class="ac"><button class="btn primary" data-p="/api/decide/${f.id}/ok">Approve fix</button><button class="btn danger" data-p="/api/decide/${f.id}/no">Reject</button></div>`:f.status=="fixed"?`<div class="ac"><button class="btn" data-p="/api/rollback/${f.id}">Roll back this fix</button></div>`:"";
 return`<article class="panel fc${FSEEN.has(f.id+f.status)?"":" enter"}"><div class="ph"><span class="pt">${esc(f.title)}</span><span>${tg(f.sev,"bad")}${tg(lab[0],lab[1])}</span></div><div class="pb">${stepper(f)}<div class="cols2"><div><div class="lb">What happened</div><p>${esc(f.what)}</p><div class="lb">Why it matters</div><p>${esc(f.why)}</p><div class="lb">Proposed fix</div><p>${esc(f.fixtxt)}</p></div><div><div class="lb">How the system knew</div>${bars(f)}${f.before!==undefined?`<div class="lb">State before the fix</div><pre>${esc(f.before===null?"none configured":JSON.stringify(f.before))}</pre>`:""}</div></div>${f.status=="fixed"?`<p class="mu" style="margin-top:12px">Verified by checking the cloud again: ${f.verified?"the problem is gone.":"a problem remains."}</p>`:""}${a}</div></article>`}
function seeds(){const o={};(ML.multi||"").split("\n").forEach(l=>{const c=l.split("|").map(x=>x.trim());if(c.length>=7&&Object.values(NAMES).includes(c[1]))o[c[1]]=c.slice(2,7).map(x=>{const m=x.match(/([\d.]+)\s*\+\/-\s*([\d.]+)/);return m?[+m[1],+m[2]]:null})});return o}
function cSeeds(){const o=seeds(),ks=Object.values(NAMES).filter(n=>o[n]&&o[n][2]);if(!ks.length)return none("Run scripts\\multi_seed.py to generate this chart.");
 const W=620,L=150,R=24,rh=46,H=ks.length*rh+40,x=v=>L+v*(W-L-R);let s="";
 for(let t=0;t<=5;t++){const X=x(t/5);s+=`<line class="gl" x1="${X}" x2="${X}" y1="6" y2="${H-26}"/><text class="ax" x="${X}" y="${H-8}" text-anchor="middle">${(t/5).toFixed(1)}</text>`}
 ks.forEach((n,i)=>{const [m,sd]=o[n][2],y=24+i*rh;s+=`<text class="ax" x="${L-12}" y="${y+4}" text-anchor="end">${n}</text><line class="draw" pathLength="1" style="--i:${i}" x1="${x(Math.max(0,m-sd))}" x2="${x(Math.min(1,m+sd))}" y1="${y}" y2="${y}" stroke="var(--c1)" stroke-width="2.5" stroke-linecap="round"/><circle class="pop" style="--i:${i}" cx="${x(m)}" cy="${y}" r="6" fill="var(--c1)"><title>${n}: F1 ${m} +/- ${sd}</title></circle>`});
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="F1 mean and standard deviation across seeds">${s}</svg>`}
function evalTable(){const r=ML.results,ks=Object.keys(NAMES).filter(k=>r[k]);if(!ks.length)return none("No results yet.");
 return`<div class="wrap"><table class="tbl"><tr><th>Detector</th><th>Controlled F1 (synthetic)</th><th>False alarms per hour</th><th>Real attack windows flagged</th><th>flaws.cloud alert rate</th></tr>${ks.map((k,i)=>{const c=r[k].controlled,nr=r[k].new_real_recall||{},t=Object.values(nr).reduce((a,v)=>a+v.windows,0),h=Math.round(Object.values(nr).reduce((a,v)=>a+v.windows*v.recall,0)),o=r[k].old_real_unlabelled;
 return`<tr><td>${NAMES[k]}</td><td style="min-width:140px">${c.f1}<div class="bt"><i class="gx" style="width:${c.f1*100}%;--i:${i}"></i></div></td><td>${c.false_alarms_per_hour}</td><td>${h} of ${t}</td><td>${o?(o.alert_rate*100).toFixed(1)+"%":"n/a"}</td></tr>`}).join("")}</table></div>`}
const V={
overview(){return Views.overview()},findings(){return Views.findings()},events(){return Views.events()},
inventory(){const ev=esc(JSON.stringify(S.evidence,null,2)).replace(/&quot;([^&]*?)&quot;:/g,'<span class="k">&quot;$1&quot;:</span>');
 return`<section class="panel"><div class="ph"><span class="pt">Resources</span></div><div class="wrap"><table class="tbl"><tr><th>Resource</th><th>Description</th><th>State</th><th>Simulated attack</th></tr>${S.resources.map(r=>`<tr><td>${esc(r.name)}</td><td class="mu">${esc(r.desc)}</td><td>${tg(r.ok?r.good:r.badtxt,r.ok?"ok":"bad")}</td><td class="mu">${esc(r.attack)}</td></tr>`).join("")}</table></div></section>
 <section class="panel mt"><div class="ph"><span class="pt">Security rules</span></div><div class="wrap"><table class="tbl"><tr><th>Resource</th><th>Rule</th><th>Reference</th><th>Severity</th><th>Status</th></tr>${RU.map(u=>{const ok=(S.resources.find(r=>r.id==u.id)||{ok:u.ok}).ok;return`<tr><td>${esc(u.name)}</td><td>${esc(u.title)}</td><td class="mu">${esc(u.ref)}</td><td>${esc(u.sev)}</td><td>${tg(ok?"Pass":"Fail",ok?"ok":"bad")}</td></tr>`}).join("")}</table></div></section>
 <section class="panel mt"><div class="ph"><span class="pt">Raw API responses</span><span class="mu">${S.mode=="Live AWS"?"Live AWS":"Local AWS emulator"}</span></div><div class="pb"><pre>${ev}</pre></div></section>`},
threats(){const c=ML.card||{},th=c.thresholds||{};
 return`<div class="cols2"><section class="panel"><div class="ph"><span class="pt">Controlled benchmark</span><span class="mu">synthetic data</span></div><div class="pb">${Views.slot("detectors",240)}</div></section><section class="panel"><div class="ph"><span class="pt">F1 across random seeds</span><span class="mu">mean and standard deviation</span></div><div class="pb">${cSeeds()}</div></section></div>
 <section class="panel mt"><div class="ph"><span class="pt">Calibration on real logs</span><span class="mu">flaws.cloud, unlabelled</span></div><div class="pb">${Views.slot("calib",200)}<p class="mu" style="margin-top:8px">Thresholds target a 1% alert rate on generated normal behaviour. The gap on real logs shows the generated baseline does not transfer.</p></div></section>
 <h2 class="sec">Alerts and explanations</h2>${S.findings.length?S.findings.map(f=>fcard(f,false)).join(""):'<div class="panel">'+none("No alerts yet. Simulate an attack on the Overview page.")+'</div>'}
 <div class="cols2 mt"><section class="panel"><div class="ph"><span class="pt">Model card</span></div><div class="pb">${c.features?`<p><span class="mu">Window</span> ${esc(c.window)} per identity</p><p><span class="mu">Threshold rule</span> ${esc(c.threshold_rule)}</p><div class="lb">Thresholds</div>${Object.keys(th).map(k=>`<p>${esc(NAMES[k]||k)} <span class="mu">${th[k]}</span></p>`).join("")}<div class="lb">Features (${c.features.length})</div>${c.features.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}`:none("Run scripts\\train_eval.py to create the model card.")}</div></section>
 <section class="panel"><div class="ph"><span class="pt">Review list</span><span class="mu">flaws.cloud, top windows</span></div>${ML.top&&ML.top.length?`<div class="wrap"><table class="tbl"><tr><th>Identity</th><th>Window</th><th>Calls</th><th>Errors</th></tr>${ML.top.map(t=>`<tr><td class="mono">${esc(String(t.principal).split("/").pop())}</td><td class="mono">${esc(String(t.win).slice(0,16))}</td><td>${esc(t.call_count)}</td><td>${esc(t.error_ratio)}</td></tr>`).join("")}</table></div>`:none("Run train_eval.py with the flaws.cloud logs.")}</section></div>`},
response(){return`<p class="note">Nothing is fixed without approval. Approvals are tied to the exact resource version, and every fix can be rolled back.</p>${S.findings.length?S.findings.map(f=>fcard(f,true)).join(""):'<div class="panel">'+none("Nothing to review yet.")+'</div>'}`},
audit(){return Views.audit()}};
function post(){document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,k=el.dataset.k,dec=+(el.dataset.dec||0),suf=el.dataset.suf||"",from=PREV[k]==null?0:PREV[k];PREV[k]=to;if(from===to)return;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=(from+(to-from)*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(f)})(t0)});
 document.querySelectorAll(".rc").forEach(c=>{const to=+c.dataset.to,d=+c.dataset.d,from=PREV.ring==null?0:PREV.ring;PREV.ring=to;c.style.strokeDasharray=`${d*from/100} ${d}`;requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.strokeDasharray=`${d*to/100} ${d}`}))});
 S.events.forEach(e=>SEEN.add(evk(e)));S.findings.forEach(f=>FSEEN.add(f.id+f.status));Views.bind()}
function render(anim){const r=route(),a=$("app");$("nav").innerHTML=PAGES.map(p=>`<a class="nv${p[0]==r?" on":""}" href="#${p[0]}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[p[0]]}</svg>${p[1]}</a>`).join("");$("title").textContent=PAGES.find(p=>p[0]==r)[1];a.innerHTML=V[r]();
 if(anim){a.classList.remove("anim");void a.offsetWidth;a.classList.add("anim");clearTimeout(window._t);window._t=setTimeout(()=>a.classList.remove("anim"),1600)}post()}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.cgTheme=t}catch(e){}$("theme").textContent=t=="light"?"Dark mode":"Light mode"}
document.addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(b){b.disabled=true;act(b.dataset.p)}});
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme=="light"?"dark":"light");
window.addEventListener("hashchange",()=>{render(true);window.scrollTo(0,0);if(route()=="audit")loadAudit()});
let T0="dark";try{T0=localStorage.cgTheme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}setTheme(T0);
render(true);poll().then(()=>render(true));loadStatic();loadAudit();setInterval(poll,1500);setInterval(()=>{if(route()=="audit")loadAudit()},4000);
</script></body></html>
